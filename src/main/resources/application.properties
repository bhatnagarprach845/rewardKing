# -----------------------------------------------------------------------------
# Database (Supabase PostgreSQL) — loaded from environment variables
# Set DB_URL, DB_USERNAME, DB_PASSWORD in your environment or AWS Secrets Manager.
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool (conservative settings for Lambda cold starts)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.idle-timeout=60000

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.defer-datasource-initialization=true
spring.main.lazy-initialization=true

# -----------------------------------------------------------------------------
# Cashback business rules — tune without a redeploy
# -----------------------------------------------------------------------------
# Cashback percentage awarded per receipt (0.03 = 3%)
cashback.rate=0.03

# Minimum wallet balance required before a user can redeem (in INR)
cashback.payout.threshold=30.00

# -----------------------------------------------------------------------------
# File uploads
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080

# -----------------------------------------------------------------------------
# H2 (disabled — using PostgreSQL)
# -----------------------------------------------------------------------------
spring.h2.console.enabled=false

# -----------------------------------------------------------------------------
# Logging
# Reduce to INFO / WARN in production to avoid leaking PII to CloudWatch.
# -----------------------------------------------------------------------------
logging.level.com.bhatn.cashbackking=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN
