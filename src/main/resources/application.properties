# =============================================================================
# RewardKing ? application.properties
# =============================================================================
# SECURITY: This file must NEVER contain real secrets.
# All sensitive values are read from environment variables at runtime.
# =============================================================================

# -----------------------------------------------------------------------------
# AWS Cognito / OAuth2
# -----------------------------------------------------------------------------
aws.cognito.issuer-uri=arn:aws:cognito-idp:us-east-2:608659035826:userpool/us-east-2_OfWs7erUH

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-2.amazonaws.com/us-east-2_OfWs7erUH
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://cognito-idp.us-east-2.amazonaws.com/us-east-2_OfWs7erUH/.well-known/jwks.json

# -----------------------------------------------------------------------------
# AWS Region & S3
# -----------------------------------------------------------------------------
spring.cloud.aws.region.static=us-east-2
spring.cloud.aws.credentials.instance-profile=false
AWS_REGION=us-east-2
aws.s3.bucket=Reward-king-receipts

# -----------------------------------------------------------------------------
# Razorpay ? loaded from environment variables
# -----------------------------------------------------------------------------
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.account.number=${RAZORPAY_ACCOUNT_NUMBER}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# -----------------------------------------------------------------------------
# Database (Supabase PostgreSQL) ? loaded from environment variables
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool (conservative settings for Lambda cold starts)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.idle-timeout=60000

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# FIX 1: Removed use_jdbc_metadata_defaults=false to allow clean schema updates

# FIX 2: Turned back to true to force data.sql scripts to respect Java execution boundaries
spring.jpa.defer-datasource-initialization=true

# Initial initialization sequencing config
spring.main.lazy-initialization=false
spring.data.jpa.repositories.bootstrap-mode=deferred

# -----------------------------------------------------------------------------
# Reward business rules ? tune without a redeploy
# -----------------------------------------------------------------------------
# Updated rule property to handle clean integer points multiplier logic
Reward.points.multiplier=10

# -----------------------------------------------------------------------------
# File uploads
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080

# -----------------------------------------------------------------------------
# H2 (disabled ? using PostgreSQL)
# -----------------------------------------------------------------------------
spring.h2.console.enabled=false

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.com.bhatn.rewardking=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN