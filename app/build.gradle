

plugins {
    id 'com.android.application'
    // id 'com.android.library' // Use this if it's a library module
}

android {
    namespace 'com.bhatn.cashbackking'
    compileSdk 34

    defaultConfig {
        applicationId "com.bhatn.cashbackking"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

repositories {
    google()
    mavenCentral()
}

// THIS BLOCK IS MANDATORY
dependencies {
    // AWS Amplify
    implementation 'com.amplifyframework:aws-auth-cognito:2.14.0'
    implementation 'com.amplifyframework:aws-storage-s3:2.14.0'

    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.6.1'
}